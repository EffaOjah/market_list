<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Market List</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f4;
            margin: 0;
            padding: 20px;
        }

        .container {
            max-width: 600px;
            margin: auto;
            background: white;
            padding: 20px;
            border-radius: 10px;
        }

        h1 {
            text-align: center;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
        }

        th, td {
            padding: 12px;
            border-bottom: 1px solid #ddd;
            text-align: left;
        }

        th {
            background-color: #333;
            color: white;
        }

        .total {
            text-align: right;
            font-size: 20px;
            font-weight: bold;
            margin-top: 20px;
        }
    </style>
</head>

<body>

    <div class="container">

        <h1>🛒 My Market List</h1>

        <table>
            <thead>
                <tr>
                    <th>Item</th>
                    <th>Quantity</th>
                    <th>Price</th>
                </tr>
            </thead>

            <tbody>
                <tr>
                    <td>Rice</td>
                    <td>5 kg</td>
                    <td>₦12,000</td>
                </tr>

                <tr>
                    <td>Beans</td>
                    <td>2 kg</td>
                    <td>₦4,500</td>
                </tr>

                <tr>
                    <td>Tomatoes</td>
                    <td>1 basket</td>
                    <td>₦6,000</td>
                </tr>

                <tr>
                    <td>Onions</td>
                    <td>1 bag</td>
                    <td>₦3,000</td>
                </tr>

                <tr>
                    <td>Vegetable Oil</td>
                    <td>2 litres</td>
                    <td>₦20,000</td>
                </tr>
            </tbody>
        </table>

        <div class="total">
            Total: ₦30,500
        </div>

    </div>

</body>
</html>
